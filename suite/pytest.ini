[pytest]
# xunit1, because the capability markers travel to the report as junit
# <properties> on each testcase, and record_property is not supported by
# xunit2 - pytest warns on every test that uses it and writes the properties
# anyway. Relying on output the tool says is non-conformant is a bug waiting
# for a pytest release; expectations matched by marker would start silently
# missing, and every declared limitation would turn into an unexpected
# failure.
junit_family = xunit1
